[package]
name = "vox_engine"
description = "voxel game engine"
authors = ["Veer Singh <veer.singh.real@pm.me>"]
version = "0.3.5"
edition = "2024"
readme = "README.md"
repository = "https://github.com/varda-games/voxEngine"
documentation = "https://varda-games.github.io/voxEngine/"
license = "Unlicense"
keywords = ["gamedev", "game-engine", "graphics"]
categories = ["game-engines"]

[dependencies]
sdl3 = { version = "0.20.0", features = ["ash"] }
vulkano = "0.35.2"
ash = "0.38.0"
dear-imgui-rs = {version = "0.22.0", optional = true}
dear-imgui-ash = {version = "0.22.0", optional = true }
dear-imgui-sdl3 = {version = "0.22.0", optional = true }
dear-imgui-reflect = {package = "dear-imgui-reflect-glam033", version = "0.22.0", features = ["glam"], optional = true }
sdl3-sys = "0.7.2"
getset = "0.1.7"

png = "0.18.1"

rapier3d = "0.36.1"
rayon = "1.12.0"

[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["imgui"]
imgui = [
    "dep:dear-imgui-rs",
    "dep:dear-imgui-ash",
    "dep:dear-imgui-sdl3",
    "dep:dear-imgui-reflect"
]

[profile.release]
debug = true
codegen-units = 1
