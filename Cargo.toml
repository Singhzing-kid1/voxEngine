[package]
name = "vox_engine"
version = "0.3.0"
edition = "2024"
readme = "README.md"
repository = "https://github.com/Singhzing-kid1/voxEngine"
license = "Unlicense"
keywords = ["gamedev", "game-engine", "graphics"]
categories = ["game-engineear"]

[dependencies]
sdl3 = { version = "0.20.0", features = ["ash"] }
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
ash = "0.38.0"
dear-imgui-rs = "0.22.0"
dear-imgui-ash = "0.22.0"
dear-imgui-sdl3 = "0.22.0"
dear-imgui-reflect = { version = "0.22.0", features = ["glam"] }
sdl3-sys = "0.7.2+SDL-3.4.18"
getset = "0.1.7"

png = "0.18.1"

rapier3d = "0.36.1"
rayon = "1.12.0"

# this is a temp fix(will be reverted once glamx rexports glam@0.34), it does NOT effect any actual game mechanics ONLY debug windows.
[patch.crates-io]
dear-imgui-reflect = { path = "vendor/dear-imgui-reflect"}

[profile.release]
debug = true
codegen-units = 1
